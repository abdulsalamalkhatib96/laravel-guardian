name: Bootstrap Laravel Guardian

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-guardian.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .guardian-bootstrap/part-* > /tmp/guardian-source.tar.gz.b64
          base64 --decode /tmp/guardian-source.tar.gz.b64 > /tmp/guardian-source.tar.gz
          echo "7d9b22b7f5fdabe7a905a9d0f29021f12c8383714a23ae35e697aa5f88ddf675  /tmp/guardian-source.tar.gz" | sha256sum --check -
          tar -xzf /tmp/guardian-source.tar.gz

      - name: Remove bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .guardian-bootstrap
          rm -f guardian-source.tar.gz.b64
          rm -f .github/workflows/bootstrap-guardian.yml

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initial Laravel Guardian production correctness engine"
          git push origin HEAD:main
